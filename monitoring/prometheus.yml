global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prompt-service'
    static_configs:
      - targets: ['prompt-service:8080']
    metrics_path: '/metrics'

  - job_name: 'assignment-service'
    static_configs:
      - targets: ['assignment-service:9090']
    metrics_path: '/metrics'

  - job_name: 'analysis-service'
    static_configs:
      - targets: ['analysis-service:9091']
    metrics_path: '/metrics'

  - job_name: 'llm-gateway'
    static_configs:
      - targets: ['llm-gateway:8000']
    metrics_path: '/metrics'

rule_files:
  - alert-rules.yml
