apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignment-service
spec:
  replicas: 5
  selector:
    matchLabels:
      app: assignment-service
  template:
    metadata:
      labels:
        app: assignment-service
    spec:
      containers:
      - name: assignment-service
        image: assignment-service:latest
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analysis-service
  template:
    metadata:
      labels:
        app: analysis-service
    spec:
      containers:
      - name: analysis-service
        image: analysis-service:latest
        env:
        - name: METRIC_STORE_URL
          value: "http://metric-store:5432"
---
apiVersion: v1
kind: Service
metadata:
  name: assignment-service
spec:
  selector:
    app: assignment-service
  ports:
  - port: 80
    targetPort: 9090
