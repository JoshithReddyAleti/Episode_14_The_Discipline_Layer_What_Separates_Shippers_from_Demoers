# Configuration for Prompt A/B Testing Framework — End-to-End
lab_name: prompt_ab_testing_framework
version: 1.0

# Adjust for your target model / provider
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.2

# Data settings
data:
  input_path: ./inputs
  output_path: ./outputs
  sample_size: 100

# Runtime
runtime:
  batch_size: 10
  max_workers: 4
  timeout_seconds: 60
