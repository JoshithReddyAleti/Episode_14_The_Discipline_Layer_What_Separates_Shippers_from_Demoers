# Configuration for HNSW Tuning Workshop — Recall vs QPS Trade-offs
lab_name: hnsw_tuning_workshop
version: 1.0

# Adjust for your target model / provider
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.2

# Data settings
data:
  input_path: ./inputs
  output_path: ./outputs
  sample_size: 100

# Runtime
runtime:
  batch_size: 10
  max_workers: 4
  timeout_seconds: 60
