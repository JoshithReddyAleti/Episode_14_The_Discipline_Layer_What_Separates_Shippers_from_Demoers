version: '3.9'

services:
  # Vector DB (example: Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Postgres for metric store
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: metricsadmin
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: metrics
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml
    ports:
      - "9090:9090"

  # Grafana
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"

  # Episode 14 dev container
  ep14:
    build: .
    volumes:
      - .:/app
    depends_on:
      - qdrant
      - postgres
    environment:
      QDRANT_URL: http://qdrant:6333
      POSTGRES_URL: postgresql://metricsadmin:devpassword@postgres:5432/metrics

volumes:
  qdrant_data:
  pg_data:
